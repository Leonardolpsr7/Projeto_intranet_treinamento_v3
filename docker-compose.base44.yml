services:
  web:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "3000:5000"
    environment:
      - BASE44_PREVIEW_MODE=${BASE44_PREVIEW_MODE:-0}
      - PYTHONUNBUFFERED=1
    env_file:
      - /run/base44/app.env
    command: ["sh", "-ec", "pip install --no-cache-dir -r requirements.txt && exec python src/main.py"]
    restart: on-failure
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    labels:
      base44.project: "Intranet Treinamento"
      base44.kind: "web"
      base44.port: "3000"
